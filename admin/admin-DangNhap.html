<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Đăng nhập Admin | Sylphia Shop</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * {margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",Arial,sans-serif;}
    body {
      background: #fffaf5;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
      color: #333;
    }

    .container {
      width: 950px;
      display: grid;
      grid-template-columns: 280px 1fr;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      background: #fff;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      background: linear-gradient(135deg,#ff7a00,#ff9b42);
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
    }

    .sidebar h1 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 30px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu-item {
      background: rgba(255,255,255,0.15);
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
      cursor: pointer;
    }

    .menu-item:hover {
      background: rgba(255,255,255,0.25);
      transform: translateX(4px);
    }

    .menu-item i {
      width: 22px;
      text-align: center;
    }

    .footer {
      font-size: 12px;
      text-align: center;
      opacity: 0.9;
    }

    /* ===== LOGIN ===== */
    .login {
      padding: 60px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #fff;
    }

    .login h2 {
      font-size: 28px;
      color: #ff7a00;
      margin-bottom: 8px;
    }

    .login p {
      color: #666;
      margin-bottom: 28px;
    }

    .field {
      position: relative;
      margin-bottom: 16px;
    }

    .field i {
      position: absolute;
      left: 12px; top: 50%; transform: translateY(-50%);
      color: #aaa;
    }

    .field input {
      width: 100%;
      padding: 12px 12px 12px 38px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: 0.2s;
    }

    .field input:focus {
      border-color: #ff7a00;
      box-shadow: 0 0 0 3px rgba(255,122,0,0.2);
    }

    .btn {
      width: 100%;
      background: #ff7a00;
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover { background: #ff8e2b; }

    .actions {
      margin-top: 12px;
      text-align: center;
    }
    .actions a {
      color: #ff7a00;
      text-decoration: none;
      font-weight: 500;
    }
    .actions a:hover { text-decoration: underline; }

    /* Social login */
    .social-login {
      margin-top: 24px;
      text-align: center;
    }

    .social-btns {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 10px;
    }

    .social-btn {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 14px;
      background: #fff;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #333;
      font-weight: 500;
    }

    .social-btn i { font-size: 18px; }

    .social-btn:hover {
      border-color: #ff7a00;
      color: #ff7a00;
      transform: translateY(-2px);
    }

    @media (max-width: 820px) {
      .container { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div>
        <h1><i class="fa-solid fa-store"></i> Sylphia Admin</h1>
        <div class="menu">
          <div class="menu-item"><i class="fa-solid fa-house"></i>Trang chủ</div>
          <div class="menu-item"><i class="fa-solid fa-box"></i>Sản phẩm</div>
          <div class="menu-item"><i class="fa-solid fa-user-group"></i>Khách hàng</div>
          <div class="menu-item"><i class="fa-solid fa-tags"></i>Giá bán</div>
          <div class="menu-item"><i class="fa-solid fa-receipt"></i>Đơn hàng</div>
          <div class="menu-item"><i class="fa-solid fa-warehouse"></i>Tồn kho</div>
        </div>
      </div>
      <div class="footer">© 2025 Sylphia Shop</div>
    </aside>

    <!-- LOGIN -->
   <section class="login">
  <h2>Đăng nhập quản trị</h2>
  <p>Nhập thông tin để truy cập hệ thống quản lý</p>

  <form onsubmit="return login(event)">
    <div class="field">
      <i class="fa-solid fa-user"></i>
      <input type="text" id="username" placeholder="Tên đăng nhập">
    </div>

    <div class="field">
      <i class="fa-solid fa-lock"></i>
      <input type="password" id="password" placeholder="Mật khẩu">
    </div>

    <button class="btn" type="submit">Đăng nhập</button>
  </form>

  <div class="actions">
    <a href="#">Quên mật khẩu?</a>
  </div>

  <div class="social-login">
    <p>Hoặc đăng nhập bằng</p>
    <div class="social-btns">
      <div class="social-btn" onclick="socialLogin('Google')">
        <i class="fa-brands fa-google" style="color:#db4437;"></i> 
      </div>
      <div class="social-btn" onclick="socialLogin('GitHub')">
        <i class="fa-brands fa-github"></i> 
      </div>
    </div>
  </div>
</section>
</div>

<script>
  function login(event) {
    event.preventDefault(); 
    alert("Đăng nhập thành công!");
    window.location.href = "admin-TongQuan.html";
    return false;
  }

  function socialLogin(platform) {
    alert(`Đăng nhập bằng ${platform} (Thành công!)`);
    window.location.href = "admin-TongQuan.html";
  }
</script>

</body>
</html>
