<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THÔNG TIN CÁ NHÂN</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        /* The position: relative is no longer strictly needed here if there's no absolutely positioned logo */
        /* But keeping it doesn't hurt if you plan to add other absolutely positioned elements */
        position: relative;
      }

      /* Since .logo is removed, these styles won't apply unless you add it back */
      /* .logo a:hover {
        color: #007bff;
      } */

      .container {
        background-color: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 25px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #555;
        font-weight: bold;
      }

      .form-group input[type="text"],
      .form-group input[type="date"],
      .form-group input[type="tel"],
      .form-group input[type="email"] {
        width: calc(100% - 20px);
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
      }

      .form-group input[type="radio"] {
        margin-right: 5px;
      }

      .gender-group label {
        display: inline-block;
        margin-right: 15px;
      }

      /* Styles for the new .submit link acting as a button */
      .submit {
        display: block; /* Make it a block-level element to take full width */
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 20px;
        text-align: center; /* Center the text inside the button */
        text-decoration: none; /* Remove underline from the link */
        box-sizing: border-box; /* Ensure padding is included in the width */
      }

      .submit:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>THÔNG TIN CÁ NHÂN</h1>

      <div class="form-group">
        <label for="fullName">Họ tên</label>
        <input type="text" id="fullName" name="fullName" />
      </div>

      <div class="form-group">
        <label for="dob">Ngày sinh</label>
        <input type="date" id="dob" name="dob" />
      </div>

      <div class="form-group">
        <label for="address">Địa chỉ</label>
        <input type="text" id="address" name="address" />
      </div>

      <div class="form-group">
        <label for="phone">Số điện thoại</label>
        <input type="tel" id="phone" name="phone" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" />
      </div>

      <div class="form-group">
        <label>Giới tính</label>
        <div class="gender-group">
          <input type="radio" id="male" name="gender" value="male" />
          <label for="male">Nam</label>
          <input type="radio" id="female" name="gender" value="female" />
          <label for="female">Nữ</label>
          <input type="radio" id="other" name="gender" value="other" />
          <label for="other">Khác</label>
        </div>
      </div>
      <a href="/trangchinh/trangchu.html" class="submit"> Xác nhận </a>
    </div>
  </body>
</html>
