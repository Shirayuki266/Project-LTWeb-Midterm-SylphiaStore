<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký | Sylphia Shop</title>
    <link rel="stylesheet" href="../css/register.css" />
    <link
      rel="icon"
      type="image/png"
      href="../images/logo-web-removebg-preview.png"
    />
  </head>

  <body>
    <!-- Header giữ phong cách trang chủ -->
    <header>
      <div class="logo">
        <img
          src="../images/logo-web-removebg-preview.png"
          alt="Logo"
          style="
            width: 40px;
            height: 40px;
            vertical-align: middle;
            margin-right: 5px;
          "
        />
        Sylphia Shop
      </div>
      <nav>
        <a href="trangchu.html">Trang Chủ</a>
        <a href="sanpham.html">Sản Phẩm</a>
        <a href="#">Liên Hệ</a>
        <a href="giohang.html">Giỏ Hàng</a>
        <a href="dangnhap.html">Đăng nhập</a>
      </nav>
    </header>

    <!-- Form đăng ký -->
    <main class="register-container">
      <form class="register-form" action="#" method="post">
        <h1>Đăng Ký Tài Khoản</h1>

        <label for="username">Tên đăng ký</label>
        <input type="text" id="username" name="username" required />

        <label for="number-phone">Số điện thoại</label>
        <input type="text" id="number-phone" name="number-phone" required />

        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" required />

        <label for="password2">Xác nhận mật khẩu</label>
        <input type="password" id="password2" name="password2" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <div class="button-group">
          <a href="/user/dangnhap.html" class="btn secondary"
            >Quay lại đăng nhập</a
          >
          <a href="/user/trangchu-dangnhap.html" class="btn primary">
            Hoàn tất đăng ký
          </a>
        </div>
      </form>
    </main>

    <!-- Footer -->
    <footer>
      <p>© 2025 SylphiaShop. All rights reserved.</p>
      <p>Email: support@sylphiashop.vn | Hotline: 0123-456-789</p>
    </footer>
  </body>
</html>
