<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi Tiết Sản Phẩm - Sylphia Shop</title>
    <link rel="stylesheet" href="../css/chitietsanpham.css" />
</head>

<body>
    <header class="header">
        <div class="logo">
            <img src="../images/logo-web-removebg-preview.png" alt="Logo" />
            <span>Sylphia Shop</span>
        </div>
        <div class="icons">
            <span class="search-icon">
                <!-- SVG kính lúp -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </span>

            <input type="text" placeholder="Tìm kiếm..." />

            <span class="filter-icon">
                <!-- SVG phễu -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3h18L13 14v7H11v-7L3 3z" />
                </svg>
            </span>
        </div>
        <nav class="nav">
            <a href="trangchu-dangnhap.html">Trang chủ</a>
            <a href="sanpham-dangnhap.html">Sản phẩm</a>
            <a href="#">Liên hệ</a>
            <a href="giohang.html">Giỏ hàng</a>
            <a href="trangchu.html">Đăng Xuất</a>
        </nav>
    </header>

    <!-- Khu vực hiển thị sản phẩm -->
    <main class="product-detail">
        <div class="product-image">
            <img id="product-image" src="" alt="Sản phẩm" />
        </div>

        <div class="product-info">
            <h1 id="product-name"></h1>
            <p id="product-price" class="price"></p>
            <p id="product-desc" class="description"></p>
            <div class="actions">
                <input type="number" min="1" value="1" />
                <button class="add-to-cart">Thêm vào giỏ</button>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2025 SylphiaShop. All rights reserved.</p>
        <p>Email: support@sylphiashop.vn | Hotline: 0123-456-789</p>
    </footer>


</body>

</html>
