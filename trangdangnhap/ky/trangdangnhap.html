<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang Đăng Nhập</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; /* Font hiện đại */
        background-color: #eef2f7; /* Màu nền nhẹ nhàng */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        box-sizing: border-box;
      }

      form {
        background-color: #ffffff;
        padding: 40px; /* Padding lớn hơn cho màn hình desktop */
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); /* Bóng đổ tinh tế */
        width: 90%; /* Chiếm phần lớn chiều rộng viewport */
        max-width: 420px; /* Giới hạn chiều rộng tối đa */
        box-sizing: border-box;
      }

      h1 {
        text-align: center;
        color: #2c3e50; /* Màu chữ tiêu đề */
        margin-bottom: 30px;
        font-size: 2.2em;
      }

      label {
        display: block;
        text-align: left;
        margin-bottom: 8px;
        color: #34495e; /* Màu chữ label */
        font-weight: 600; /* Nhãn đậm */
        font-size: 0.95em;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%; /* Chiếm toàn bộ chiều rộng có thể */
        padding: 12px 15px; /* Padding input */
        margin-bottom: 20px; /* Khoảng cách dưới input */
        border: 1px solid #c9d6df; /* Màu border mềm mại */
        border-radius: 6px;
        font-size: 1.05em;
        box-sizing: border-box;
      }

      input[type="text"]:focus,
      input[type="password"]:focus {
        border-color: #007bff; /* Highlight khi focus */
        outline: none;
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
      }

      a {
        color: #007bff;
        text-decoration: none;
        margin-bottom: 20px; /* Tăng khoảng cách dưới link */
        display: block; /* Đảm bảo link chiếm một dòng riêng */
        text-align: right; /* Căn phải link quên mật khẩu */
        font-size: 0.95em;
      }

      a:hover {
        text-decoration: underline;
        color: #0056b3;
      }

      .main-submit-button {
        background-color: #28a745; /* Nút Đăng Nhập màu xanh lá */
        padding: 12px 15px; /* Padding lớn hơn */
        font-size: 1.05em; /* Font lớn hơn */
        margin-top: 20px; /* Khoảng cách trên nút từ link "Quên mật khẩu?" */
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        text-align: center;
        display: block; /* Đảm bảo nút chiếm một dòng riêng */
        font-weight: 600;
        transition: background-color 0.3s ease, transform 0.2s ease;
      }

      .main-submit-button:hover {
        background-color: #218838;
        transform: translateY(-2px);
      }

      .social-login {
        display: flex;
        justify-content: center;
        gap: 20px; /* Khoảng cách giữa các icon */
        margin-top: 30px; /* Khoảng cách trên social login */
        margin-bottom: 25px; /* Khoảng cách dưới social login */
      }

      .social-login input[type="image"] {
        border: 1px solid #c9d6df; /* Border icon */
        border-radius: 50%;
        padding: 8px; /* Padding xung quanh icon */
        width: 45px; /* Kích thước icon lớn hơn một chút */
        height: 45px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08); /* Bóng đổ cho icon */
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .social-login input[type="image"]:hover {
        transform: scale(1.1);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      }

      .register-section {
        margin-top: 25px; /* Khoảng cách trên phần đăng ký */
        text-align: center;
        display: flex; /* Dùng flexbox để căn chỉnh văn bản và nút */
        align-items: center; /* Căn giữa theo chiều dọc */
        justify-content: center; /* Căn giữa theo chiều ngang */
        flex-wrap: wrap; /* Cho phép xuống dòng trên màn hình nhỏ */
        gap: 10px; /* Khoảng cách giữa text và nút */
      }

      .register-section .text-medium {
        color: #6c757d;
        font-size: 0.95em;
      }

      .register-button {
        background-color: #007bff; /* Nút Đăng Kí Ngay màu xanh dương */
        color: white;
        padding: 10px 15px; /* Padding nhỏ hơn một chút so với nút Đăng Nhập */
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.95em;
        font-weight: 600;
        transition: background-color 0.3s ease, transform 0.2s ease;
      }

      .register-button:hover {
        background-color: #0056b3;
        transform: translateY(-2px);
      }

      /* ========================================================= */
      /* MEDIA QUERIES cho thiết bị di động (màn hình nhỏ hơn 600px) */
      /* ========================================================= */
      @media (max-width: 600px) {
        form {
          padding: 25px;
          border-radius: 8px;
          box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
          max-width: 95%; /* Cho phép form rộng hơn trên màn hình nhỏ */
        }

        h1 {
          margin-bottom: 20px;
          font-size: 1.8em;
        }

        label {
          font-size: 0.9em;
        }

        input[type="text"],
        input[type="password"] {
          padding: 10px 12px;
          margin-bottom: 15px;
          font-size: 1em;
        }

        a {
          margin-bottom: 15px;
          font-size: 0.9em;
        }

        .main-submit-button {
          padding: 10px 15px;
          font-size: 1em;
          margin-top: 5px; /* Giảm khoảng cách */
        }

        .main-submit-button:hover {
          transform: translateY(
            0
          ); /* Loại bỏ hiệu ứng nâng trên màn hình cảm ứng */
        }

        .social-login {
          gap: 15px; /* Giảm khoảng cách giữa các icon */
          margin-top: 25px;
          margin-bottom: 20px;
        }

        .social-login input[type="image"] {
          width: 40px; /* Giảm kích thước icon */
          height: 40px;
          padding: 6px;
        }

        .social-login input[type="image"]:hover {
          transform: scale(1); /* Bỏ hiệu ứng scale trên màn hình cảm ứng */
          box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08); /* Giữ bóng đổ nhẹ */
        }

        .register-section {
          margin-top: 20px;
          flex-direction: column; /* Xếp dọc trên điện thoại */
          gap: 8px; /* Khoảng cách giữa text và nút */
        }

        .register-section .text-medium {
          font-size: 0.9em;
          margin-bottom: 0; /* Loại bỏ margin nếu có */
        }

        .register-button {
          width: 100%; /* Nút đăng ký chiếm toàn bộ chiều rộng */
          padding: 8px 12px;
          font-size: 0.9em;
        }

        .register-button:hover {
          transform: translateY(
            0
          ); /* Loại bỏ hiệu ứng nâng trên màn hình cảm ứng */
        }
      }

      /* ========================================================= */
      /* MEDIA QUERIES cho màn hình rất nhỏ (ví dụ: iPhone SE cũ) */
      /* ========================================================= */
      @media (max-width: 380px) {
        form {
          padding: 20px;
        }
        h1 {
          font-size: 1.6em;
          margin-bottom: 15px;
        }
        label {
          font-size: 0.85em;
        }
        input[type="text"],
        input[type="password"] {
          padding: 8px 10px;
          margin-bottom: 12px;
          font-size: 0.95em;
        }
        a {
          margin-bottom: 12px;
          font-size: 0.85em;
        }
        .main-submit-button {
          padding: 8px 12px;
          font-size: 0.95em;
          margin-top: 5px;
        }
        .social-login {
          margin-top: 20px;
          margin-bottom: 15px;
          gap: 10px;
        }
        .social-login input[type="image"] {
          width: 35px;
          height: 35px;
          padding: 5px;
        }
        .register-section {
          margin-top: 15px;
          gap: 5px;
        }
        .register-section .text-medium {
          font-size: 0.85em;
        }
        .register-button {
          padding: 6px 10px;
          font-size: 0.85em;
        }
      }
    </style>
  </head>
  <body>
    <form action="/trangchu/dangnhap" method="post">
      <h1>Đăng Nhập</h1>
      <label for="username">Tên đăng nhập:</label>
      <input type="text" id="username" name="username" /><br />
      <label for="password">Mật khẩu:</label>
      <input type="password" id="password" name="password" /><br />
      <a href="/trangchu/trangquenmatkhau">Quên mật khẩu?</a><br />
      <a href="/trangchinh/trangchu.html" class="main-submit-button">
        Đăng Nhập
      </a>

      <div class="social-login">
        <!-- Đảm bảo đường dẫn hình ảnh tuyệt đối hoặc tương đối đúng -->
        <input
          type="image"
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/1200px-Google_%22G%22_logo.svg.png"
          alt="Google Login"
          formaction="/trangchu/dangnhapgoogle"
        />
        <input
          type="image"
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Facebook_Logo_%282019%29.png/1200px-Facebook_%22G%22_logo.svg.png"
          alt="Facebook Login"
          formaction="/trangchu/dangnhapfacebook"
        />
      </div>

      <div class="register-section">
        <span class="flex-shrink-0 text-medium text-neutral-500"
          >Bạn chưa có tài khoản?</span
        >
        <a href="/trangdangnhap/ky/tragdangky.html" class="register-button">
          Đăng Kí Ngay
        </a>
      </div>
    </form>
  </body>
</html>
