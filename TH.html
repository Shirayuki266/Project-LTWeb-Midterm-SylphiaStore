<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duy Mobile - Cửa hàng điện thoại uy tín</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f8f9fa;
    }

    /* HEADER */
    header {
      background-color: #cfa64e;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .search-bar {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 20px;
    }

    .search-bar input {
      width: 60%;
      padding: 8px;
      border: none;
      border-radius: 4px 0 0 4px;
      outline: none;
    }

    .search-bar button {
      padding: 8px 12px;
      background-color: #7a5f26;
      border: none;
      border-radius: 0 4px 4px 0;
      color: white;
      cursor: pointer;
    }

    .auth-buttons a {
      background-color: white;
      color: #cfa64e;
      padding: 8px 12px;
      border-radius: 5px;
      margin-left: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .auth-buttons a:hover {
      background-color: #f1f1f1;
    }

    /* MENU */
    nav {
      background-color: #333;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      padding: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 8px 15px;
      font-weight: bold;
    }

    nav a:hover {
      color: #ffd700;
    }

    /* SẢN PHẨM */
    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 30px;
    }

    .product {
      background-color: white;
      border-radius: 8px;
      border: 1px solid #ddd;
      width: 220px;
      text-align: center;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .product:hover {
      transform: scale(1.05);
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 5px;
    }

    .product h3 {
      font-size: 16px;
      margin: 10px 0 5px;
    }

    .product p {
      color: #d9534f;
      font-weight: bold;
      margin: 5px 0;
    }

    .product button {
      background-color: #cfa64e;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    .product button:hover {
      background-color: #b48a3c;
    }

    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <div class="auth-buttons">
      <a href="dangnhap.html">Đăng nhập</a>
      <a href="#">Đăng ký</a>
    </div>
    <div class="logo">📱 Duy Mobile</div>
    <div class="search-bar">
      <input type="text" placeholder="Tìm kiếm sản phẩm...">
      <button>Tìm kiếm</button>
    </div>
  </header>

  <nav>
    <a href="#">Trang chủ</a>
    <a href="#">Liên hệ</a>
    <a href="#">Sản phẩm</a>
    <div class="auth-buttons">
      <a href="dangnhap.html">Đăng nhập</a>
      <a href="#">Đăng ký</a>
    </div>
  </nav>

  <div class="products">
    <div class="product">
      <img src="img/iphone-17-pro-model-unselect-gallery-2-202509-GEO-EMEA.avif" alt="iPhone 17 Pro Max">
      <h3>iPhone 17 Pro Max</h3>
      <p>Giá: 29.990.000₫</p>
      <button>Mua ngay</button>
    </div>

    <div class="product">
      <img src="img/samsung-galaxy-s24-ultra_4__1.webp" alt="Samsung S24 Ultra">
      <h3>Samsung S24 Ultra</h3>
      <p>Giá: 27.490.000₫</p>
      <button>Mua ngay</button>
    </div>

    <div class="product">
      <img src="img/xiaomi14.jpg" alt="Xiaomi 14">
      <h3>Xiaomi 14</h3>
      <p>Giá: 18.990.000₫</p>
      <button>Mua ngay</button>
    </div>
  </div>

  <footer>
    © 2025 Duy Mobile | Hotline: 0123 456 789

  </footer>
</body>
</html>
